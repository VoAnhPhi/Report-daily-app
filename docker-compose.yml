services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: report_daily
      POSTGRES_USER: report_daily
      POSTGRES_PASSWORD: report_daily_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_daily -d report_daily"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - report_daily_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - report_daily_redis:/data

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ROLE: web
      PORT: 4000
      APP_PORT: 4000
      DATABASE_URL: postgresql://report_daily:report_daily_dev@db:5432/report_daily
      DIRECT_URL: postgresql://report_daily:report_daily_dev@db:5432/report_daily
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: report-daily-local-access-secret
      JWT_REFRESH_SECRET_KEY: report-daily-local-refresh-secret
      FRONTEND_DOMAIN: http://localhost:3000
      BACKEND_DOMAIN: http://localhost:4000
      MAIL_ENABLED: "false"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000
      AUTH_SECRET: report-daily-local-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  report_daily_postgres:
  report_daily_redis:
